# Stage 2g hand-verified residual label set. Generated by
# tools/catalog/sample_matcher_residual_candidates.py (candidates only --
# see that script's docstring); a human fills in `verdict` for each entry
# before tools.catalog.bibliographic_join.load_residual_labels treats it as
# ground truth. Entries with `verdict: null` are ignored -- unreviewed, not
# ground truth. See docs/BOOK_CATALOG.md's residual-label-set section for
# the full protocol.
#
# verdict values (fill in one per entry; leave others null/empty):
#   correct       -- candidate_work_key really is this Goodreads book.
#   wrong         -- candidate_work_key is NOT this book. If you know the
#                    right OL workKey, put it in corrected_work_key.
#   no_ol_match   -- this Goodreads book genuinely has no entry in Open
#                    Library at all (e.g. self-published, too obscure).
#   unsure        -- couldn't tell from title/author alone.
#
# sample_reason meanings:
#   unmatched_popular       -- no OL candidate was found at all.
#   ambiguous_popular       -- matcher found candidates, declined to pick;
#                              candidate_* is its top-scored guess only.
#   low_margin_title_author -- matcher picked candidate_work_key, but by a
#                              thin margin over the runner-up.
#   suspicious_duplicate    -- this book_id shares candidate_work_key with
#                              another Goodreads book whose title/author
#                              don't obviously match it.
#
# `suggested_verdict` / `suggested_corrected_work_key` / `suggested_reasoning`
# are a one-time AI-drafted first pass (not re-generated by the sampler --
# hand-added, grounded in direct full.sqlite lookups where noted in the
# reasoning text), meant to speed up the human pass below, NOT to replace it.
# `load_residual_labels` never reads these three fields -- only `verdict` /
# `corrected_work_key` / `notes` count as ground truth. To use a suggestion,
# copy `suggested_verdict` into `verdict` (and `suggested_corrected_work_key`
# into `corrected_work_key` if set) once you've actually checked it; override
# either where the suggestion looks wrong. Reasoning flagged "unsure" in the
# suggestion is a real signal the AI pass couldn't ground the call (usually:
# a narrow automated OL search came up empty, an OL-side duplicate-work-key
# fragmentation, or an ambiguous small-press edition) -- worth a closer look,
# not just a quick copy-through. Several entries' reasoning also calls out
# distinct title-normalization gaps found in the process of building these
# suggestions (native-script vs. romanized author names on at least 3 books;
# GR "and"-introduced subtitles the Stage 2h colon-fix doesn't cover; a
# period-vs-slash date-title mismatch; a stray zero-width-space character) --
# none fixed in this pass; each is called out inline where it applies.

