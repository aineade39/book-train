# Catalog build profiles — see docs/BOOK_CATALOG.md.
# JSON mirror at profiles.json (stdlib fallback when PyYAML is absent).

profiles:
  full:
    max_works: null
    languages: []
    min_editions: 1
    description: "Mac — entire qualifying Open Library corpus"

  ios_en:
    max_works: 250000
    languages: [eng]
    min_editions: 2
    description: "iOS bundle — English, popular works"

  dev_smoke:
    max_works: 10000
    languages: [eng]
    min_editions: 1
    description: "CI / local dev smoke catalog"

  ios_en_shelf:
    max_works: 250000
    languages: [eng]
    min_editions: 2
    description: >-
      iOS bundle — like ios_en, but popularityRank is re-ranked (and gap-filled)
      using Goodreads Listopia shelf signals instead of raw OL edition count alone.
    # NOT built by tools/build_book_catalog.py's generic subset-from path — that
    # path can't apply a language filter to a subset build at all (see
    # Sources/catalog-build/CatalogOLBuild.swift's buildFromSubset, which has no
    # language-filter branch) and knows nothing about Goodreads. This field only
    # documents the profile's shape (for the .sqlite.json sidecar / discoverability);
    # tools/build_book_catalog.py refuses to build any profile that sets it.
    custom_build_script: tools/catalog/build_ios_en_from_goodreads.py
